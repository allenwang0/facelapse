[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facelapse"
version = "0.1.0"
description = "Reconstruct a neutral-face aging timelapse from a chaotic personal photo archive."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "pytest-cov>=5"]
e2e = ["playwright>=1.45"]
ml = ["insightface>=0.7.3", "onnxruntime>=1.16", "mediapipe>=0.10", "py-feat>=0.6"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["facelapse*"]

[tool.setuptools.package-data]
facelapse = ["*.html", "*.m"]

[project.scripts]
facelapse = "facelapse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "e2e_smoke.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
files = ["facelapse/records.py", "facelapse/identity.py", "facelapse/bucketing.py", "facelapse/smoothing.py"]
strict = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.coverage.run]
source = ["facelapse"]
# wrappers around the optional ML libraries and the macOS-only helper;
# they cannot run in the core test environment
omit = ["facelapse/detection.py", "facelapse/__main__.py"]
